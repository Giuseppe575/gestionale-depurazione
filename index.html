<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionale Depurazione – Anteprima</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
    }
    .card-header {
      background: linear-gradient(90deg, #006064, #00acc1);
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
      color: #fff;
      text-align: center;
      padding: 1.5rem 1rem;
    }
    .btn-submit {
      background: #006064;
      color: #fff;
      font-weight: 600;
    }
    .btn-submit:hover {
      background: #004d40;
    }
    input[readonly] {
      background: #f8f9fa;
    }
  </style>
</head>
<body>

  <!-- iframe nascosto per il POST -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <div class="card">
    <div class="card-header">
      <h2><i class="fas fa-water"></i> Impianto Depurazione</h2>
      <small>Anteprima Interfaccia</small>
    </div>
    <div class="card-body p-4">
      <form id="formMisura"
            action="https://script.google.com/macros/s/AKfycby-zdYGbyl9o1etWe1iiSepgrmDFcgb6cjdDxQQ4qQjj_PhXfQeKo5ToUErQMRJEQtXnw/exec"
            method="post"
            target="hidden_iframe">

        <div class="mb-3">
          <label for="operatore" class="form-label">
            <i class="fas fa-user"></i> Operatore
          </label>
          <input type="text" class="form-control" id="operatore" name="operatore"
                 placeholder="Nome operatore" required>
        </div>

        <div class="mb-3">
          <label for="ph" class="form-label">
            <i class="fas fa-vial"></i> pH
          </label>
          <input type="number" step="0.01" class="form-control" id="ph" name="ph"
                 placeholder="es. 7.25" required>
        </div>

        <div class="mb-3">
          <label for="ssImohf" class="form-label">
            <i class="fas fa-filter"></i> Solidi sospesi sedimentabili (cono IMOHF)
          </label>
          <input type="number" step="0.1" class="form-control" id="ssImohf" name="ssImohf"
                 placeholder="es. 8.3" required>
        </div>

        <div class="mb-3">
          <label for="timestamp" class="form-label">
            <i class="fas fa-calendar-alt"></i> Data/Ora inserimento
          </label>
          <input type="text" class="form-control" id="timestamp" name="timestamp" readonly>
        </div>

        <button type="submit" class="btn btn-submit w-100">
          <i class="fas fa-save"></i> Salva su Google Sheets
        </button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formMisura');
      const iframe = document.getElementById('hidden_iframe');

      // Popola il campo timestamp in italiano
      function aggiornaTimestamp() {
        const now = new Date();
        document.getElementById('timestamp').value =
          now.toLocaleString('it-IT', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
      }
      aggiornaTimestamp();

      let pending = false;
      form.addEventListener('submit', () => { pending = true; });

      iframe.onload = () => {
        if (pending) {
          alert('✅ Dati salvati in Google Sheets!');
          form.reset();
          aggiornaTimestamp();
          pending = false;
        }
      };
    });
  </script>
</body>
</html>
